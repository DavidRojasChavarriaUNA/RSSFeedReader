openapi: 3.0.3
info:
  title: RSS Feed Reader MVP Subscription API
  version: 1.0.0
paths:
  /subscriptions:
    get:
      summary: List subscriptions
      responses:
        "200":
          description: The current session-local subscription list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Subscription"
    post:
      summary: Add a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSubscriptionRequest"
      responses:
        "201":
          description: The subscription was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          description: Empty or whitespace-only URL
components:
  schemas:
    Subscription:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          example: https://example.com/feed.xml
    AddSubscriptionRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          minLength: 1
          example: https://example.com/feed.xml
